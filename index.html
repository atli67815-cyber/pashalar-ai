<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pashalar AI</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sol Menü / Sidebar */
        .sidebar {
            width: 260px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        .brand img {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            object-fit: cover;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-chat-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Ana Sohbet Alanı */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user .avatar {
            background-color: #0284c7;
            color: white;
        }

        .assistant .avatar {
            background: none;
            padding: 0;
        }

        .assistant .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
        }

        .user .bubble {
            background-color: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant .bubble {
            background-color: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }

        /* Input Alanı */
        .input-container {
            padding: 20px;
            background-color: #0f172a;
            border-top: 1px solid #1e293b;
        }

        .input-box {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background-color: #1e293b;
            padding: 8px 12px 8px 18px;
            border-radius: 14px;
            border: 1px solid #334155;
        }

        .input-box:focus-within {
            border-color: #38bdf8;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            resize: none;
            outline: none;
            height: 44px;
            line-height: 22px;
            padding-top: 11px;
        }

        button.send-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            align-self: center;
        }

        button.send-btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <!-- Sol Taraf: Menü ve Logo -->
    <div class="sidebar">
        <div class="brand">
            <img src="logo.png" alt="Pashalar AI Logo">
            <h1>Pashalar AI</h1>
        </div>
        <button class="new-chat-btn" onclick="location.reload()">
            <span>+</span> Yeni Sohbet
        </button>
    </div>

    <!-- Sağ Taraf: Sohbet Alanı -->
    <div class="main-content">
        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="avatar"><img src="logo.png" alt="AI"></div>
                <div class="bubble">
                    Merhaba! Ben Pashalar AI. Size nasıl yardımcı olabilirim?
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="Pashalar AI'a bir şeyler sorun..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const chatContainer = document.getElementById('chatContainer');

            // Kullanıcı mesajını ekle
            chatContainer.innerHTML += `
                <div class="message user">
                    <div class="avatar">Siz</div>
                    <div class="bubble">${escapeHtml(message)}</div>
                </div>
            `;

            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Yükleniyor mesajı ekle
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div class="message assistant" id="${loadingId}">
                    <div class="avatar"><img src="logo.png" alt="AI"></div>
                    <div class="bubble">Düşünüyor...</div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                const loadingElement = document.getElementById(loadingId);
                
                if (data.response) {
                    loadingElement.querySelector('.bubble').innerText = data.response;
                } else {
                    loadingElement.querySelector('.bubble').innerText = "Bir hata oluştu.";
                }
            } catch (error) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) {
                    loadingElement.querySelector('.bubble').innerText = "Bağlantı hatası oluştu.";
                }
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
